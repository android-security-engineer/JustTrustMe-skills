apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId 'just.trust.me'
        minSdkVersion 16
        targetSdkVersion 33
        versionCode 3
        versionName '.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Skill-layer scripts and docs expect this exact artifact path.
            android.applicationVariants.all { variant ->
                variant.outputs.all {
                    outputFileName = "JustTrustMe.apk"
                }
            }
        }
    }
    productFlavors {
    }
    useLibrary 'org.apache.http.legacy'

    // Lint is irrelevant for a release Xposed module and its vital check needs a
    // large kotlin-compiler artifact not present in offline caches.
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'org.apache.httpcomponents:httpcore:4.4.2'
}
